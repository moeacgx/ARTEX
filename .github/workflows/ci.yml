name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    runs-on: ubuntu-latest
    steps:
      - name: 核对 main 来源和同一提交的线上验证
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr || pr.base.ref !== 'main') return;
            if (pr.head.ref !== 'dev' || pr.head.repo.full_name !== context.payload.repository.full_name) {
              core.setFailed('main 仅接收本仓库 dev 分支的 PR。');
              return;
            }
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              ...context.repo, ref: pr.head.sha, environment: 'production-dev', per_page: 100,
            });
            for (const deployment of deployments) {
              if (deployment.sha !== pr.head.sha) continue;
              const statuses = await github.rest.repos.listDeploymentStatuses({
                ...context.repo, deployment_id: deployment.id, per_page: 1,
              });
              if (statuses.data[0]?.state === 'success') {
                core.notice(`dev 提交 ${pr.head.sha} 已完成线上验证，deployment #${deployment.id}。`);
                return;
              }
            }
            core.setFailed('该 dev 提交尚无 production-dev 成功部署记录；先部署并验收，再合入 main。');

  reporter-regression:
    needs: branch-policy
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex_test
          POSTGRES_PASSWORD: artex_test
          POSTGRES_DB: artex_reporter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex_test -d artex_reporter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARTEX_PG_DSN: postgres://artex_test:artex_test@127.0.0.1:5432/artex_reporter_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 预编译报告回归测试
        run: go test ./server -run '^$' -timeout 60s
      - name: 报告触发及真实写回回归
        run: >-
          timeout 60s go test ./server
          -run '^(TestTriggeredRunUsesAgentBoundProfileWithoutGlobalChatAgent|TestReporterSavesReportAfterStartupProxyRecovers|TestToolTriggerRetriesUnavailableAgentWithoutDuplicatingOtherTriggers)$'
          -count=1 -timeout 60s

  checks:
    needs: branch-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 全仓编译
        run: go test ./... -run '^$' -timeout 60s
      - name: 更新和生命周期定向回归
        run: |
          timeout 60s go test ./selfupdate ./config -count=1 -timeout 60s
          timeout 60s go test ./server -run '^(TestReleaseCache|TestUpdateStatus|TestWorkspaceProtects|TestPauseCancelsWithNamedCause|TestResumeYieldsFreshContext|TestResumeDoesNotClearDeleteBarrier)' -count=1 -timeout 60s
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - name: 前端类型和更新流程
        working-directory: web
        run: |
          npx tsc --noEmit
          timeout 60s node --import ./scripts/test-api-loader.mjs --test src/lib/update-flow.test.mjs src/lib/update-api.test.mjs
